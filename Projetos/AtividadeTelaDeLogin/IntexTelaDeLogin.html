<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TelaDeLogin</title>
    <link rel="stylesheet" href="StyleTelaDeLogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cossette+Texte:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <h1>Bem - vindo de volta</h1>
        <p>Acesse sua conta agora</p>
        <br>
        <button type="button">ENTRAR</button>
        
        <br><br>
        <hr>
        <br>

        <h2>CRIA SUA CONTA</h2>
        <br>

        <form>
            <label>NOME</label>
            <input type="text" placeholder="Digite seu nome">
            <br><br>

            <label>E-MAIL</label>
            <input type="email" placeholder="Digite seu e-mail">
            <br><br>

            <label>SENHA</label>
            <input type="password" placeholder="Digite sua senha">
            <br><br>

            <button type="submit">CADASTRAR</button>
        </form>

    </div>

</body>
</html>
